{% extends "catalog/base.html" %}
{% load static %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        {% if product.image %}
        <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.name }}">
        {% else %}
        <img src="{% static 'images/default-product.png' %}" class="img-fluid" alt="No image">
        {% endif %}
    </div>
    <div class="col-md-6">
        <h1>{{ product.name }}</h1>
        <p class="fs-4">{{ product.price }} руб.</p>
        <p>{{ product.description }}</p>
        <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Назад к списку</a>
    </div>
</div>
{% endblock %}
