{% extends "catalog/base.html" %}
{% block content %}
<div class="product-detail">
    <h1>{{ product.name }}</h1>
    <img src="{{ product.image.url }}" alt="{{ product.name }}">
    <p>{{ product.description }}</p>
    <p>Цена: {{ product.price }}</p>
    <a href="{% url 'home' %}">Назад к списку</a>
</div>
{% endblock %}
