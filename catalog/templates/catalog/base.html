<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}МойМагазин{% endblock %}</title>
    {% load static %}
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'catalog/menu.html' %}

    <div class="container my-4">
        {% if user.is_staff %}
        <div class="mb-3 text-end">
            <a href="{% url 'catalog:product_create' %}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Добавить продукт
            </a>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <footer class="bg-dark text-white py-3 mt-4">
        <div class="container text-center">
            <p class="mb-0">&copy; 2023 МойМагазин</p>
        </div>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
